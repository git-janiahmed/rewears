{% load static %}

<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{%  static 'style/fonts.css' %}">

    <script src="https://cdn.tailwindcss.com"></script>
    <title>Upload product | Re - Wears </title>
    <link rel="stylesheet" href="{%  static 'style/style.css' %}">
    <link rel="stylesheet" href="{%  static 'style/product.css' %}">

</head>

<body>
    {% include '../components/mainheader.html' %}


    <!-- Card Section -->
    <div class="max-w-4xl px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
        <h1 class="text-3xl font-bold underline text-center">
            Upload a product
        </h1>
        <br><br>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Card -->
            <div class="bg-white rounded-xl shadow">


                <div class=" p-4 sm:p-7">
                    <!-- Grid -->
                    <div class="space-y-4 sm:space-y-6">

                        <div class="space-y-2">
                            <label for="images" class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Product images
                            </label>

                            <label for="images"
                                class="group p-4 sm:p-7 block cursor-pointer text-center border-2 border-dashed border-gray-200 rounded-lg focus-within:outline-none focus-within:ring-2 focus-within:ring-primary-500 focus-within:ring-offset-2">
                                <input required id="images" name="images" type="file" class="sr-only" multiple>
                                <svg class="size-10 mx-auto text-gray-400" xmlns="http://www.w3.org/2000/svg" width="16"
                                    height="16" fill="currentColor" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd"
                                        d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2z" />
                                    <path
                                        d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383zm.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z" />
                                </svg>
                                <span class="mt-2 block text-sm text-gray-800">
                                    Browse your device or <span
                                        class="group-hover:text-primary-700 text-primary-600">drag 'n drop'</span>
                                </span>
                                <span class="mt-1 block text-xs text-gray-500">
                                    Maximum file size is 2 MB
                                </span>
                            </label>
                        </div>

                        <div id="image-preview-container" class="flex flex-wrap gap-4 mb-4"></div>

                        <div class="space-y-2">
                            <label for="af-submit-app-title"
                                class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Title
                            </label>
                            <input required name="title" id="af-submit-app-title" name="title" type="text"
                                class="py-2 px-3 pe-11 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                                placeholder="Enter Title">
                        </div>

                        <div class="space-y-2">
                            <label for="af-submit-app-description"
                                class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Description
                            </label>

                            <textarea name="description" id="af-submit-app-description"
                                class="py-2 px-3 block w-full border-gray-200 shadow-sm rounded-lg border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                                rows="6"
                                placeholder="A detailed summary will better explain your products to the audiences. Our users will see this in your dedicated product page."></textarea>
                        </div>


                        <div class="items-start space-y-2">
                            <!-- Back Button and Title -->
                            <div class="flex  mb-4" style="align-items: end;">
                                <button type="button" onclick="goBack()" id="back-button" style="display: none;"
                                    class="text-gray-500 mr-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 19l-7-7 7-7" />
                                    </svg>
                                </button>
                                <label class="inline-block text-sm font-medium text-gray-800 mt-2.5"
                                    id="current-category-title">Select a Category</label>
                            </div>

                            <hr class="my-2">

                            <!-- Main Category Dropdown (Hardcoded) -->
                            <div class="space-y-2" id="main-category-container">
                                <select id="main_category" name="main_category"
                                    class="py-2 px-3 block w-full border-gray-200 shadow-sm rounded-lg text-sm">
                                    <option selected>Select a main category</option>
                                    <option value="1" data-category-id="1">MEN</option>
                                    <option value="2" data-category-id="2">WOMEN</option>
                                    <option value="3" data-category-id="3">KIDS</option>
                                    <option value="4" data-category-id="4">BEAUTY</option>
                                </select>
                            </div>

                            <!-- Dynamic Subcategory List -->
                            <ul id="categories" class="space-y-2 mt-4" style="display: none;">
                                <!-- Subcategories will be dynamically loaded here -->
                            </ul>
                        </div>


                        <input id="sub_sub_category" name="sub_sub_category" hidden aria-hidden="true">


                        <div class="space-y-2" style="display: none;">
                            <label for="brand" class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Brand
                            </label>

                            <select id="brand" name="brand"
                                class="py-2 px-3 pe-9 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none">
                                <option value="">Select Brand</option>
                            </select>
                        </div>
                        <style>
                            .brand-input {
                                padding: 0.5rem;
                                width: 100%;
                                border: 1px solid #d1d5db;
                                border-radius: 0.375rem;
                                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
                                font-size: 0.875rem;
                            }

                            .brand-input:focus {
                                border-color: #3b82f6;
                                outline: none;
                                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
                            }
                        </style>
                        <div class="space-y-2">
                            <label for="brand" class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Brand
                            </label>
                            <input list="brand-list" id="brand-input" name="brand_name"
                                class="py-2 px-3 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                                placeholder="Select or enter a brand">
                            <datalist id="brand-list">
                                <!-- Add more options as needed -->
                                <option value="dfssdf">
                            </datalist>
                        </div>
                        <div class="space-y-2">
                            <label for="size" class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Size
                            </label>

                            <select required id="size" name="size"
                                class="py-2 px-3 pe-9 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none">
                                <option value="">Select Size</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label for="Color" class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Color
                            </label>

                            <fieldset class="flex flex-wrap gap-4 pt-4">

                                <label for="id_colors_0"
                                    class="block size-8 cursor-pointer rounded-full bg-red-500 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-red-500 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="1" id="id_colors_0" class="sr-only" />
                                    <span class="sr-only">red</span>
                                </label>

                                <label for="id_colors_1"
                                    class="block size-8 cursor-pointer rounded-full bg-red-600 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-red-600 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="2" id="id_colors_1" class="sr-only" />
                                    <span class="sr-only">Red</span>
                                </label>

                                <label for="id_colors_2"
                                    class="block size-8 cursor-pointer rounded-full bg-blue-500 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-blue-500 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="3" id="id_colors_2" class="sr-only" />
                                    <span class="sr-only">Blue</span>
                                </label>

                                <label for="id_colors_3"
                                    class="block size-8 cursor-pointer rounded-full bg-green-500 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-green-500 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="4" id="id_colors_3" class="sr-only" />
                                    <span class="sr-only">Green</span>
                                </label>

                                <label for="id_colors_4"
                                    class="block size-8 cursor-pointer rounded-full bg-yellow-500 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-yellow-500 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="5" id="id_colors_4" class="sr-only" />
                                    <span class="sr-only">Yellow</span>
                                </label>

                                <label for="id_colors_5"
                                    class="block size-8 cursor-pointer rounded-full bg-black shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-black has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="6" id="id_colors_5" class="sr-only" />
                                    <span class="sr-only">Black</span>
                                </label>

                                <label for="id_colors_6"
                                    class="block size-8 cursor-pointer rounded-full bg-white shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-black has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="7" id="id_colors_6" class="sr-only" />
                                    <span class="sr-only">White</span>
                                </label>

                                <label for="id_colors_7"
                                    class="block size-8 cursor-pointer rounded-full bg-gray-500 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-gray-500 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="8" id="id_colors_7" class="sr-only" />
                                    <span class="sr-only">Gray</span>
                                </label>

                                <label for="id_colors_8"
                                    class="block size-8 cursor-pointer rounded-full bg-pink-500 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-pink-500 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="9" id="id_colors_8" class="sr-only" />
                                    <span class="sr-only">Pink</span>
                                </label>

                                <label for="id_colors_9"
                                    class="block size-8 cursor-pointer rounded-full bg-purple-500 shadow-sm has-[:checked]:ring-2 has-[:checked]:ring-purple-500 has-[:checked]:ring-offset-2">
                                    <input type="checkbox" name="colors" value="10" id="id_colors_9" class="sr-only" />
                                    <span class="sr-only">Purple</span>
                                </label>
                            </fieldset>
                        </div>
                        <div class="space-y-2">
                            <label for="af-submit-app-material"
                                class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Material (Recommended)
                            </label>
                            <input required name="material" id="af-submit-app-material" type="text"
                                class="py-2 px-3 pe-11 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                                placeholder="About material">
                        </div>

                        <div class="space-y-2">
                            <label for="af-submit-app-condition"
                                class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Condition
                            </label>
                            <input required name="condition" id="af-submit-app-condition" type="text"
                                class="py-2 px-3 pe-11 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                                placeholder="About condition">
                        </div>

                        <div class="space-y-2">
                            <label for="af-submit-app-Price"
                                class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Price
                            </label>
                            <input required id="af-submit-app-Price" name="price" type="text"
                                class="py-2 px-3 pe-11 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                                placeholder="Enter Price">
                        </div>


                        <div class="space-y-2">
                            <label for="status" class="inline-block text-sm font-medium text-gray-800 mt-2.5">
                                Status:
                            </label>

                            <select required id="status" name="status"
                                class="py-2 px-3 pe-9 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none">
                                <option value="active" selected="">Active</option>
                                <option value="draft">Draft</option>
                                <option value="sold">Sold</option>
                            </select>
                        </div>
                    </div>


                    <div class="mt-5 flex justify-center gap-x-2">
                        <button type="submit"
                            class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:pointer-events-none">
                            Submit the Product
                        </button>
                    </div>
                </div>
            </div>
            <!-- End Card -->

        </form>
        {{form.errors}}

    </div>
    <!-- End Card Section -->






    <script src="
    https://cdn.jsdelivr.net/npm/preline@2.3.0/dist/preline.min.js
    "></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

                        'primary': '#9D977A',
                        'primary': {
                            50: '#9D977A',
                            100: '#9D977A',
                            200: '#9D977A',
                            300: '#9D977A',
                            400: '#9D977A',
                            500: '#9D977A',
                            600: '#9D977A',
                            700: '#9D977A',
                            800: '#9D977A',
                            900: '#9D977A',
                        },
                    },
                },
            }
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const mainCategorySelect = document.getElementById('main_category');
            const categoriesContainer = document.getElementById('categories');
            const mainCategoryContainer = document.getElementById('main-category-container');
            const backButton = document.getElementById('back-button');
            const categoryTitle = document.getElementById('current-category-title');
            const brandSelect = document.getElementById('brand');
            const sizeSelect = document.getElementById('size');

            let categoryHistory = [];
            backButton.style.display = 'none';

            function handleError(error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            }

            function populateBrandsAndSizes(data) {
                try {
                    // Hide category containers since we're at final selection
                    mainCategoryContainer.style.display = 'none';
                    categoriesContainer.style.display = 'none';

                    // Show back button
                    backButton.style.display = 'block';

                    // Populate brands
                    brandSelect.innerHTML = '<option value="">Select Brand</option>';
                    const brandList = document.getElementById('brand-list');

                    data.brands.forEach(brand => {
                        const option = document.createElement('option');
                        option.value = brand.id;
                        option.textContent = brand.name;
                        brandSelect.appendChild(option);

                        // Add brand to datalist
                        const datalistOption = document.createElement('option');
                        datalistOption.value = brand.name;
                        brandList.appendChild(datalistOption);
                    });

                    // Populate sizes
                    sizeSelect.innerHTML = '<option value="">Select Size</option>';
                    data.sizes.forEach(size => {
                        const option = document.createElement('option');
                        option.value = size.id;
                        option.textContent = size.name;
                        sizeSelect.appendChild(option);
                    });
                } catch (error) {
                    handleError(error);
                }
            }

            function loadSubcategories(categoryId, categoryName, isBackNavigation = false) {
                if (!isBackNavigation) {
                    categoryHistory.push({
                        id: categoryId,
                        name: categoryName
                    });
                }

                fetch(`https://www.re-wears.com/user/get_subcategories/${categoryId}/`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log(data)
                        if (Array.isArray(data) && data.length === 0) {

                            document.getElementById('sub_sub_category').setAttribute("value", categoryId);

                            console.log(categoryId)
                            console.log(document.getElementById('sub_sub_category').value)
                            // Final category selection - populate brands and sizes
                            categoryTitle.textContent = `Selected: ${categoryName}`;
                            fetch(`https://www.re-wears.com/user/get_brands_and_sizes/${categoryId}/`)
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error('Failed to fetch brands and sizes');
                                    }
                                    return response.json();
                                })
                                .then(data => {


                                    populateBrandsAndSizes(data);
                                })
                                .catch(handleError);
                        } else {
                            // Display subcategories
                            displaySubcategories(data, categoryName);
                        }
                    })
                    .catch(handleError);
            }

            function displaySubcategories(subcategories, parentName) {
                mainCategoryContainer.style.display = 'none';
                categoriesContainer.style.display = 'block';
                backButton.style.display = 'block';
                categoryTitle.textContent = parentName;

                const ul = document.createElement('ul');
                ul.classList.add('space-y-2', 'mt-4');

                subcategories.forEach(subcategory => {
                    const li = document.createElement('li');
                    li.classList.add('flex', 'justify-between', 'items-center', 'p-4', 'bg-gray-100',
                        'rounded-lg', 'cursor-pointer', 'hover:bg-gray-200', 'transition-colors');
                    li.innerHTML = `
                        <span>${subcategory.name}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    `;
                    li.onclick = () => loadSubcategories(subcategory.id, subcategory.name);
                    ul.appendChild(li);
                });

                categoriesContainer.innerHTML = '';
                categoriesContainer.appendChild(ul);
            }

            mainCategorySelect.addEventListener('change', function () {
                const selectedOption = this.options[this.selectedIndex];
                const categoryId = selectedOption.getAttribute('data-category-id');

                if (categoryId) {
                    categoryHistory = []; // Reset history when selecting main category
                    loadSubcategories(categoryId, selectedOption.textContent);
                    // Reset dropdowns
                    brandSelect.innerHTML = '<option value="">Select Brand</option>';
                    sizeSelect.innerHTML = '<option value="">Select Size</option>';
                }
            });

            // Define goBack function globally
            window.goBack = function () {
                categoryHistory.pop(); // Remove current category

                if (categoryHistory.length > 0) {
                    // Go back to previous category
                    const previousCategory = categoryHistory[categoryHistory.length - 1];
                    loadSubcategories(previousCategory.id, previousCategory.name, true);
                } else {
                    // Return to main categories
                    mainCategoryContainer.style.display = 'block';
                    categoriesContainer.style.display = 'none';
                    backButton.style.display = 'none';
                    categoryTitle.textContent = 'Select a Category';
                    mainCategorySelect.selectedIndex = 0;
                    brandSelect.innerHTML = '<option value="">Select Brand</option>';
                    sizeSelect.innerHTML = '<option value="">Select Size</option>';
                }
            };

            backButton.addEventListener('click', window.goBack);
        });

        document.getElementById('images').addEventListener('change', function (event) {
            const previewContainer = document.getElementById('image-preview-container');
            previewContainer.innerHTML = ''; // Clear previous images

            const files = Array.from(event.target.files);
            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    // Create a wrapper for image and delete button
                    const wrapper = document.createElement('div');
                    wrapper.classList.add('relative', 'h-32', 'w-32');

                    // Create image element
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.classList.add('h-full', 'w-full', 'object-cover', 'rounded-lg',
                        'shadow-md');

                    // Create delete button
                    const deleteButton = document.createElement('button');
                    deleteButton.classList.add('absolute', 'top-0', 'right-0', 'bg-black',
                        'text-white', 'rounded-full', 'h-5', 'w-5', 'flex', 'items-center',
                        'justify-center');
                    deleteButton.innerHTML = '&times;';

                    // Remove the image when delete button is clicked
                    deleteButton.addEventListener('click', function () {
                        wrapper.remove();
                    });

                    // Append the image and delete button to the wrapper
                    wrapper.appendChild(img);
                    wrapper.appendChild(deleteButton);

                    // Append wrapper to the container
                    previewContainer.appendChild(wrapper);
                };
                reader.readAsDataURL(file);
            });
        });
    </script>

    {% include '../components/mainfooter.html' %}

</body>

</html>
