{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updates and Fixes | Re - Wears</title>
  <link rel="stylesheet" href="{% static 'style/style.css' %}">
  <style>
    .content {
      max-width: 1200px;
      margin: 70px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .content h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #333;
    }

    .content .update {
      margin-bottom: 40px;
    }

    .content .update h2 {
      font-size: 1.8em;
      margin-bottom: 10px;
      color: #333;
    }

    .content .update p {
      line-height: 1.6;
      margin-bottom: 20px;
      color: #555;
    }

    .content .update .created-at {
      font-size: 0.9em;
      color: #999;
    }

    @media (max-width: 768px) {
      .content {
        padding: 15px;
      }

      .content h1 {
        font-size: 2em;
      }

      .content .update h2 {
        font-size: 1.5em;
      }
    }
  </style>
</head>

<body>
  {% include '../components/mainheader.html' %}

  <div class="content">
    <h1>Updates and Fixes</h1>
    {% for update in updates %}
    <div class="update">
      <h2><a href="{% url 'update_detail' update.id %}">{{ update.title }}</a></h2>
      <div>
        {{ update.content|safe }}
      </div>
      <p class="created-at">Posted on: {{ update.created_at|date:"F j, Y" }}</p>
    </div>
    {% endfor %}
  </div>

  {% include '../components/mainfooter.html' %}
</body>

</html>
