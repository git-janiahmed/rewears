{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ topic.title }} | Help Center</title>
  <link rel="stylesheet" href="{% static 'style/style.css' %}">
  <link rel="stylesheet" href="{% static 'style/product.css' %}">
</head>

<body class="grey_bg">
  {% include '../components/mainheader.html' %}

  <div class="helpcenter">
    <div class="inner">
      <div class="sidebar">
        <h2>
          Help Center
        </h2>

        <div class="sidebar_links">
          <a href="{% url 'helpcenter' %}">Home</a>

          {% for topic in topics %}
          <a href="{% url 'help_topic_detail' topic.pk %}">{{ topic.title }}</a>
          {% endfor %}
        </div>
      </div>

      <div class="content">
        <h2>{{ topic.title }}</h2>
        <div class="topic-content">
          {{ topic.content|safe }}
          <!-- Display the rich text content -->
        </div>
      </div>
    </div>
  </div>

  {% include '../components/mainfooter.html' %}
</body>

</html>
