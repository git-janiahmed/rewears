{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy | Re - Wears</title>
  <link rel="stylesheet" href="{% static 'style/style.css' %}">
  <style>
    .content {
      max-width: 1200px;
      margin: 70px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .content h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #333;
    }

    .content p {
      line-height: 1.6;
      margin-bottom: 20px;
      color: #555;
    }

    .content div {
      margin-bottom: 20px;
    }

    .content .last-updated {
      font-size: 0.9em;
      color: #999;
    }

    @media (max-width: 768px) {
      .content {
        padding: 15px;
      }

      .content h1 {
        font-size: 2em;
      }
    }
  </style>
</head>

<body>
  {% include '../components/mainheader.html' %}

  <div class="content">
    <h1>{{ privacy_policy.title }}</h1>
    <div>
      {{ privacy_policy.content|safe }}
    </div>
    <p class="last-updated">Last updated: {{ privacy_policy.last_updated|date:"F j, Y" }}</p>
  </div>

  {% include '../components/mainfooter.html' %}
</body>

</html>
