{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Submitted</title>
  <link rel="stylesheet" href="{% static 'style/style.css' %}">
  <style>
    .container {
      max-width: 600px;
      width: 100%;
      margin: 50px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .icon-container {
      display: inline-block;
      padding: 20px;
      background-color: #e6ffed;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .icon-container svg {
      width: 50px;
      height: 50px;
      color: #38a169;
      fill: #38a169;
    }

    .container h1 {
      font-size: 1.4rem;
      color: #333333;
      margin-bottom: 10px;
    }

    .container p {
      font-size: 15px;
      color: #666666;
      margin-bottom: 20px;
    }

    .container .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #9D977A;
      color: #ffffff;
      border-radius: 5px;
      text-decoration: none;
      font-size: 1em;
      transition: background-color 0.3s ease;
    }

    .container .btn:hover {
      background-color: #7b6f4f;
    }
  </style>
</head>

<body>
  {% include '../components/mainheader.html' %}
  <div class="container">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
        <path
          d="M224,48V208a16,16,0,0,1-16,16H136a8,8,0,0,1,0-16h72V48H48v96a8,8,0,0,1-16,0V48A16,16,0,0,1,48,32H208A16,16,0,0,1,224,48ZM125.66,154.34a8,8,0,0,0-11.32,0L64,204.69,45.66,186.34a8,8,0,0,0-11.32,11.32l24,24a8,8,0,0,0,11.32,0l56-56A8,8,0,0,0,125.66,154.34Z">
        </path>
      </svg>
    </div>
    <h1>Report Submitted</h1>
    <p>Thank you for your report. We will review it and take appropriate action.</p>
    <a href="{% url 'homepage' %}" class="btn">Go to Home</a>
  </div>
  {% include '../components/mainfooter.html' %}
</body>

</html>
