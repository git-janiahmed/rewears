{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Deleted | re-wears</title>
  <link rel="stylesheet" href="{% static 'style/style.css' %}">
  <style>
    .container {
      max-width: 600px;
      width: 100%;
      margin: 50px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .icon-container {
      display: inline-block;
      padding: 20px;
      background-color: #f2f2f2;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .icon-container svg {
      width: 50px;
      height: 50px;
      color: #9D977A;
      fill: #9D977A;
    }

    .container h1 {
      font-size: 1.4rem;
      color: #333333;
      margin-bottom: 10px;
    }

    .container p {
      font-size: 15px;
      color: #666666;
      margin-bottom: 20px;
    }

    .container .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #9D977A;
      color: #ffffff;
      border-radius: 5px;
      text-decoration: none;
      font-size: 1em;
      transition: background-color 0.3s ease;
    }

    .container .btn:hover {
      background-color: #7b6f4f;
    }
  </style>
</head>

  {% include 'components/mainheader.html' %}
